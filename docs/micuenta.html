<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Cuenta - Titan Fishing</title>
  <style>
@import url('https://fonts.cdnfonts.com/css/bahnschrift');

body, html {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: 'Bahnschrift SemiLight', sans-serif;
    display: flex;
    flex-direction: column;
    animation: fadeInBody 1.2s ease-in-out forwards; /* transición suave de opacidad */
}

@keyframes fadeInBody {
    from { opacity: 0; }
    to { opacity: 1; }
}

body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url("images/cañasycarretesfondo.jpg") no-repeat center center fixed;
    background-size: cover;
    filter: brightness(50%);
    z-index: 0;
}

header {
    background-color: rgba(3,6,102,0.85);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100px;
    padding: 0 30px;
    z-index: 10;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

header .logo-container img { height: 150px; width: auto; }

header nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 25px;
    flex: 1;
    margin-left: 30px;
}

header nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 1rem;
    transition: color 0.3s;
}

header nav a:hover { color: #ffcc00; }

.center-container {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    flex: 1;
    z-index: 5;
    margin-top: 120px;
    padding-bottom: 100px;
    width: 100%;
}

.container {
    background: rgba(255, 255, 255, 0.95);
    max-width: 800px;
    width: 90%;
    margin: 20px auto;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

h2 { text-align: center; color: #030666; margin-bottom: 20px; }

.field {
    display: flex;
    align-items: center;
    margin: 10px 0;
}

.field label {
    width: 150px;
    font-weight: bold;
    color: #030666;
}

.field span, .field input {
    flex: 1;
    padding: 5px;
}

.field button {
    margin-left: 10px;
    padding: 5px 10px;
    background-color: #030666;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.field button:hover { background-color: #021a99; }

footer {
    background: rgba(3,6,102,0.85);
    color: white;
    text-align: center;
    padding: 15px 20px;
    position: fixed;
    bottom: 0;
    width: 100%;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

footer a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
}

footer a:hover { color: #ffcc00; }

@media(max-width:768px){
    .field { flex-direction: column; align-items:flex-start; }
}
</style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="images/logo2_white4.png" alt="Titan Fishing Logo">
  </div>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="CarritodelUsuario.html">Carrito</a>
    <a href="#">Mi cuenta</a>
  </nav>
</header>

<div class="center-container">
  <div class="container">
    <h2>Mi Cuenta</h2>

    <h3>Información Personal</h3>
    <div class="field">
      <label>Nombre:</label>
      <span id="nameSpan"></span>
      <input type="text" id="nameInput" style="display:none;">
      <button onclick="editField('name')">Editar</button>
    </div>
    <div class="field">
      <label>Email:</label>
      <span id="emailSpan"></span>
      <input type="text" id="emailInput" style="display:none;">
      <button onclick="editField('email')">Editar</button>
    </div>

    <h3>Dirección</h3>
    <div class="field">
      <label>Calle:</label>
      <span id="streetSpan"></span>
      <input type="text" id="streetInput" style="display:none;">
      <button onclick="editField('street')">Editar</button>
    </div>
    <div class="field">
      <label>Ciudad:</label>
      <span id="citySpan"></span>
      <input type="text" id="cityInput" style="display:none;">
      <button onclick="editField('city')">Editar</button>
    </div>
    <div class="field">
      <label>Estado:</label>
      <span id="stateSpan"></span>
      <input type="text" id="stateInput" style="display:none;">
      <button onclick="editField('state')">Editar</button>
    </div>
    <div class="field">
      <label>Código Postal:</label>
      <span id="zipSpan"></span>
      <input type="text" id="zipInput" style="display:none;">
      <button onclick="editField('zip')">Editar</button>
    </div>
    <div class="field">
      <label>País:</label>
      <span id="countrySpan"></span>
      <input type="text" id="countryInput" style="display:none;">
      <button onclick="editField('country')">Editar</button>
    </div>
  </div>
</div>

<footer>
  <a href="#">Facebook</a>
  <a href="#">Instagram</a>
  <a href="#">Twitter</a>
  <a href="#">YouTube</a>
</footer>

<script>
let userData = null;
let addressId = null;

fetch('/users/me')
    .then(response => response.json())
    .then(data => {
        userData = data;
        document.getElementById('nameSpan').innerText = data.name;
        document.getElementById('emailSpan').innerText = data.email;

        if (data.addresses && data.addresses.length > 0) {
            const address = data.addresses[0];
            addressId = address.id;
            document.getElementById('streetSpan').innerText = address.street || '';
            document.getElementById('citySpan').innerText = address.city || '';
            document.getElementById('stateSpan').innerText = address.state || '';
            document.getElementById('zipSpan').innerText = address.zip || '';
            document.getElementById('countrySpan').innerText = address.country || '';
        }
    });

function editField(field) {
    const span = document.getElementById(field + 'Span');
    const input = document.getElementById(field + 'Input');
    const currentValue = span.innerText;

    if (input.style.display === 'none') {
        input.style.display = 'inline';
        input.value = currentValue;
        span.style.display = 'none';
    } else {
        const newValue = input.value;
        span.innerText = newValue;
        input.style.display = 'none';
        span.style.display = 'inline';

        if (field === 'name' || field === 'email') {
            fetch('/users/' + userData.id, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({[field]: newValue})
            });
        } else {
            fetch('/addresses/' + addressId, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({[field]: newValue})
            });
        }
    }
}
</script>

</body>
</html>
