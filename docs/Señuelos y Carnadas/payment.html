<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pagar Orden</title>
</head>
<body>
<h3>Pagar Orden</h3>
<form id="paymentForm">
  <div>
    <label>Tarjeta:</label>
    <input type="text" id="cardNumber" placeholder="Número de tarjeta" required>
  </div>
  <div>
    <label>Expiración:</label>
    <input type="text" id="expiry" placeholder="MM/AA" required>
  </div>
  <div>
    <label>CVV:</label>
    <input type="text" id="cvv" placeholder="CVV" required>
  </div>
  <button type="submit">Pagar</button>
</form>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get("orderId");
    const method = urlParams.get("method");

    document.getElementById("paymentForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const cardNumber = document.getElementById("cardNumber").value;
      const expiry = document.getElementById("expiry").value;
      const cvv = document.getElementById("cvv").value;

      const params = new URLSearchParams();
      params.append("method", method);
      params.append("amount", 0); // Opcional: puedes calcular total desde backend
      params.append("cardNumber", cardNumber);
      params.append("expiry", expiry);
      params.append("cvv", cvv);

      try {
        const res = await fetch(`/payments/orders/${orderId}/pay?${params.toString()}`, { method: 'PUT' });
        if (res.ok) {
          alert("✅ Pago completado");
          window.location.href = `/invoices/${orderId}/pdf`;
        } else {
          alert("❌ Error al procesar el pago");
        }
      } catch (e) {
        alert("Error de conexión con el servidor.");
      }
    });
  </script>
</body>
</html>
