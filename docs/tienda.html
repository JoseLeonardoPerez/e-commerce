<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titan Fishing - Tienda</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/bahnschrift');

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Bahnschrift SemiLight', sans-serif;
      color: black;
      overflow-x: hidden;
      background: #000;
    }

    /* Animación de aparición */
    body { opacity: 0; animation: aparecer 0.8s ease-in-out forwards; }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

    /* Fondo opaco y difuminado */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('/images/fondotienda.jpg') center center no-repeat;
      background-size: cover;
      filter: blur(5px) brightness(0.5);
      z-index: -2;
    }

    /* Header fijo */
    header {
      background-color: rgba(3, 6, 102, 0.7);
      color: white;
      padding: 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
    }

    header nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    header nav a:hover { color: #ffcc00; }

    /* Logo */
    .logo-fondo {
      display: block;
      width: 350px;
      position: relative;
      z-index: 2;
    }

    /* Contenedor principal */
    .contenedor {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      padding-bottom: 150px; /* espacio para footer */
    }

    /* Fila superior: 2 tarjetas a los lados del logo */
    .superior {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      margin-top: 140px; /* suficiente margen para que no se superpongan con header */
      margin-bottom: 60px;
      width: 100%;
    }

    .superior .tarjeta {
      width: 320px;
      height: 350px;
      background: rgba(255,255,255,0.35);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      text-align: center;
      transition: transform 0.3s, background 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-decoration: none; /* quitar subrayado de link */
    }

    .superior .tarjeta:hover {
      transform: scale(1.07);
      background: rgba(255,255,255,0.45);
    }

    .superior .tarjeta h3 {
      margin: 5px 0 10px 0;
      font-size: 1.3rem;
      color: #030666;
    }

    .superior .tarjeta img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .superior .logo-wrapper {
      width: 350px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    /* Fila inferior: 3 tarjetas grandes y separadas */
    .inferior {
      display: flex;
      justify-content: space-around;
      gap: 30px;
      flex-wrap: wrap;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 50px;
    }

    .inferior .tarjeta {
      flex: 1 1 30%;
      max-width: 350px;
      height: 350px;
      background: rgba(255,255,255,0.35);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      text-align: center;
      transition: transform 0.3s, background 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      text-decoration: none; /* quitar subrayado de link */
    }

    .inferior .tarjeta:hover {
      transform: scale(1.07);
      background: rgba(255,255,255,0.45);
    }

    .inferior .tarjeta img {
      width: 100%;
      height: 280px;
      object-fit: cover;
    }

    .inferior .tarjeta h3 {
      margin: 5px 0 10px 0;
      font-size: 1.3rem;
      color: #030666;
    }

    footer {
      background: rgba(34,34,34,0.95);
      color: white;
      text-align: center;
      padding: 20px;
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 3;
    }

    /* Responsive */
    @media screen and (max-width: 900px) {
      .superior, .inferior { flex-wrap: wrap; gap: 20px; justify-content: center; }
      .superior .tarjeta, .inferior .tarjeta { width: 250px; height: 300px; }
      .superior .logo-wrapper { width: 300px; }
    }

    @media screen and (max-width: 600px) {
      .superior, .inferior { flex-direction: column; gap: 20px; align-items: center; }
      .superior .tarjeta, .inferior .tarjeta { width: 90%; height: auto; }
      .superior .logo-wrapper { width: 80%; margin: 20px 0; }
    }

  </style>
</head>
<body>

<header>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="CarritodelUsuario.html">Carrito</a>
    <a href="micuenta.html">Mi cuenta</a>
    <a href="nosotros.html">Nosotros</a>
  </nav>
</header>

<main class="contenedor">

  <!-- Fila superior: 2 tarjetas a los lados del logo -->
  <div class="superior">
    <a href="/Señuelos y Carnadas/senuelosycarnadas.html" class="tarjeta">
      <img src="/images/señuelosycarnadas.jpg" alt="Señuelos y Carnadas">
      <h3>Señuelos y Carnadas</h3>
    </a>

    <div class="logo-wrapper">
      <img src="/images/logo2_white.png" class="logo-fondo" alt="Logo Titan Fishing">
    </div>

    <a href="/Lineas y Anzuelos/lineasyanzuelos.html" class="tarjeta">
      <img src="/images/lineasyanzuelos.jpg" alt="Líneas y Anzuelos">
      <h3>Líneas y Anzuelos</h3>
    </a>
  </div>

  <!-- Fila inferior: 3 tarjetas grandes y separadas -->
  <div class="inferior">
    <a href="/Canas y Carretes/cañasycarretes.html" class="tarjeta">
      <img src="/images/cañasycarretes.jpg" alt="Cañas y Carretes">
      <h3>Cañas y Carretes</h3>
    </a>

    <a href="/Ropa y Accesorios/ropaaccesorios.html" class="tarjeta">
      <img src="/images/ropa y accesorios.jpg" alt="Ropa y Accesorios">
      <h3>Ropa y Accesorios</h3>
    </a>

    <a href="/Otros Equipos/otrosequipos.html" class="tarjeta">
      <img src="/images/otrosproductos.jpg" alt="Otros Equipos">
      <h3>Otros Equipos</h3>
    </a>
  </div>

</main>

<footer>
  &copy; 2025 Titan Fishing | Síguenos en redes sociales
</footer>

</body>
</html>
