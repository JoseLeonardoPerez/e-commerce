<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Titan Fishing</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/bahnschrift');

    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Bahnschrift SemiLight', sans-serif;
      background: url('images/login.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #030666;
      opacity: 0;
      animation: aparecer 0.8s ease-in-out forwards;
      position: relative;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.45);
      z-index: -1;
    }

    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

    /* --- HEADER --- */
    header {
      background-color: rgba(3,6,102,0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100px;
      padding: 0 30px;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    header .logo-container img {
      height: 150px;
      width: auto;
    }

    header nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 25px;
      flex: 1;
      margin-left: 30px;
    }

    header nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 1rem;
      transition: color 0.3s;
    }

    header nav a:hover {
      color: #ffcc00;
    }

    /* --- LOGIN BOX --- */
    .login-container {
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(6px);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      width: 320px;
      text-align: center;
      margin: 160px auto 0 auto;
      animation: slideUp 0.8s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    h2 {
      margin-bottom: 20px;
      color: #030666;
      font-weight: bold;
      font-size: 1.5rem;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      background: rgba(255,255,255,0.9);
    }

    button {
      width: 100%;
      padding: 10px;
      background: #030666;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
      margin-top: 5px;
    }

    button:hover { background: #ffcc00; color: #030666; }

    .error { color: red; font-size: 0.9em; }
    .success { color: green; font-size: 0.9em; }

    .register-link {
      margin-top: 15px;
      font-size: 0.95rem;
    }

    .register-link a {
      color: #030666;
      font-weight: bold;
      text-decoration: none;
    }

    .register-link a:hover {
      color: #ffcc00;
    }

    footer {
      background: rgba(34,34,34,0.95);
      color: white;
      text-align: center;
      padding: 20px;
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 2;
    }

    @media screen and (max-width: 600px) {
      header {
        flex-direction: column;
        height: auto;
        padding: 10px 10px;
      }
      header .logo-container img { height: 100px; margin-bottom: 10px; }
      header nav { gap: 10px; justify-content: center; }
      .login-container { width: 85%; margin-top: 140px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-container">
    <img src="images/logo2_white4.png" alt="Titan Fishing Logo">
  </div>
  <nav>
    <a href="../index.html">Inicio</a>
    <a href="../tienda.html">Tienda</a>
    <a href="../CarritodelUsuario.html">Carrito</a>
    <a href="#">Mi cuenta</a>
  </nav>
</header>

<div class="login-container">
  <h2>Iniciar Sesión</h2>
  <div id="message"></div>

  <form method="post" action="/perform_login">
    <input type="text" name="username" placeholder="Email" required />
    <input type="password" name="password" placeholder="Contraseña" required />
    <button type="submit">Entrar</button>
  </form>

  <div class="register-link">
    ¿Aún no tienes cuenta? <a href="register.html">Regístrate aquí</a>
  </div>
</div>

<footer>
  &copy; 2025 Titan Fishing | Síguenos en redes sociales
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const messageDiv = document.getElementById("message");
  if (params.get("error")) {
      messageDiv.innerHTML = "<p class='error'>Usuario o contraseña incorrectos</p>";
  }
  if (params.get("logout")) {
      messageDiv.innerHTML = "<p class='success'>Sesión cerrada correctamente</p>";
  }
</script>

</body>
</html>
