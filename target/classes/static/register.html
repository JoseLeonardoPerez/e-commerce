<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Titan Fishing</title>
  <style>
@import url('https://fonts.cdnfonts.com/css/bahnschrift');

body, html {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: 'Bahnschrift SemiLight', sans-serif;
  background: url('/images/fondoregistro2.jpg') no-repeat center center fixed;
  background-size: cover;
  animation: fadeInBody 1.2s ease-in-out forwards;
}

/* Transición suave solo de opacidad */
@keyframes fadeInBody {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* Header semitransparente */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background-color: rgba(3,6,102,0.85);
  color: white;
  position: sticky;
  top: 0;
  z-index: 1000;
}

header img { height: 50px; }

header nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  font-weight: bold;
}

header nav a:hover { text-decoration: underline; }

/* Contenedor del formulario */
.form-container {
  background: rgba(255,255,255,0.88);
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 500px;
  margin: 50px auto;
}

h2 { text-align: center; margin-bottom: 20px; }

label { display: block; margin-top: 10px; font-weight: bold; }

input {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 5px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 20px;
  background-color: #030666;
  color: white;
  font-weight: bold;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
}

button:hover { background-color: #021a99; }

.message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

.links {
  text-align: center;
  margin-top: 20px;
}

.links a {
  margin: 0 15px;
  padding: 8px 15px;
  background-color: #030666;
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-weight: bold;
  display: inline-block;
}

.links a:hover { background-color: #021a99; }
</style>
</head>
<body>

<header>
  <img src="/images/logo2_white4.png" alt="Titan Fishing">
  <nav>
    <a href="index.html">Inicio</a>
    <a href="tienda.html">Tienda</a>
    <a href="contacto.html">Contacto</a>
  </nav>
</header>

<div class="form-container">
  <h2>Registro de Usuario</h2>
  <form id="registerForm">
    <label for="name">Nombre</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" minlength="6" required>

    <h3>Dirección</h3>
    <label for="street">Calle</label>
    <input type="text" id="street" name="street" required>

    <label for="city">Ciudad</label>
    <input type="text" id="city" name="city" required>

    <label for="state">Estado</label>
    <input type="text" id="state" name="state" required>

    <label for="country">País</label>
    <input type="text" id="country" name="country" required>

    <label for="zip">Código Postal</label>
    <input type="text" id="zip" name="zip" required>

    <button type="submit">Registrar</button>
    <div class="message" id="message"></div>
  </form>
</div>

<div class="links">
  <a href="login.html">¿Ya tenés cuenta? Iniciar sesión</a>
  <a href="index.html">Inicio</a>
</div>

<script>
const form = document.getElementById('registerForm');
const message = document.getElementById('message');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  message.textContent = "Procesando registro...";
  message.style.color = "black";

  const data = {
    name: form.name.value.trim(),
    email: form.email.value.trim(),
    password: form.password.value.trim(),
    street: form.street.value.trim(),
    city: form.city.value.trim(),
    state: form.state.value.trim(),
    country: form.country.value.trim(),
    zip: form.zip.value.trim()
  };

  try {
    const response = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    if (response.ok) {
      message.style.color = 'green';
      message.textContent = result.message || "✅ Registro exitoso. Redirigiendo...";
      form.reset();

      setTimeout(() => { window.location.href = "login.html"; }, 2000);
    } else {
      message.style.color = 'red';
      message.textContent = result.message || "❌ Error: " + (result.error || "No se pudo registrar.");
    }
  } catch (err) {
    message.style.color = 'red';
    message.textContent = "❌ Error de conexión con el servidor.";
  }
});
</script>

</body>
</html>
