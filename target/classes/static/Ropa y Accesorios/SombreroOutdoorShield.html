<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sombrero OutdoorShield - Titan Fishing</title>
  <style>
    body {
      opacity: 0;
      animation: fadeInBody 0.8s forwards;
      font-family: 'Bahnschrift SemiLight', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    @keyframes fadeInBody { from {opacity:0;} to {opacity:1;} }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url("../images/sombrero.jpg") no-repeat center center fixed;
      background-size: cover;
      filter: brightness(50%);
      z-index: 0;
    }
    header { background-color: rgba(3,6,102,0.85); display:flex; align-items:center; justify-content:space-between; position:fixed; top:0; left:0; width:100%; height:100px; padding:0 30px; z-index:10; box-shadow:0 4px 6px rgba(0,0,0,0.3); }
    header .logo-container img { height:150px; width:auto; }
    header nav { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:25px; flex:1; margin-left:30px; }
    header nav a { color:white; text-decoration:none; font-weight:bold; font-size:1rem; transition:color 0.3s; }
    header nav a:hover { color:#ffcc00; }
    .center-container { display:flex; justify-content:center; align-items:center; flex:1; z-index:5; margin-top:50px; width:100%; }
    .product-card { background: rgba(255,255,255,0.95); padding:30px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.3); max-width:900px; width:90%; display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:center; position:relative; }
    .product-images { flex:1 1 300px; display:flex; flex-direction:column; align-items:center; gap:10px; }
    .product-images img { max-width:250px; border-radius:10px; border:1px solid #ccc; }
    .product-info { flex:1 1 400px; }
    .product-info h1 { margin-top:0; color:#030666; }
    .product-info p { margin:10px 0; line-height:1.5; }
    .price { font-size:1.8rem; font-weight:bold; margin:10px 0; color:#021a99; }
    .buttons { margin-top:20px; display:flex; gap:15px; flex-wrap:wrap; }
    .buttons button { padding:12px 25px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1rem; background-color:#030666; color:white; transition: background-color 0.3s; }
    .buttons button:hover { background-color:#021a99; }
    footer { background: rgba(3,6,102,0.85); color:white; text-align:center; padding:15px 20px; position:fixed; bottom:0; width:100%; z-index:10; display:flex; justify-content:center; align-items:center; gap:20px; }
    footer a { color:white; text-decoration:none; font-weight:bold; transition:color 0.3s; }
    footer a:hover { color:#ffcc00; }
    @media(max-width:1024px){ header{flex-direction:column;height:auto;padding:10px;} header .logo-container img{height:120px;margin-bottom:10px;} header nav{justify-content:center; gap:15px; margin-left:0;} }
    @media(max-width:768px){ .product-card{flex-direction:column;} .product-images img{max-width:200px;} footer{flex-direction:column; gap:10px;} }
  </style>
</head>
<body>
<header>
  <div class="logo-container"><img src="../images/logo2_white4.png" alt="Titan Fishing Logo"></div>
  <nav>
    <a href="../index.html">Inicio</a>
    <a href="../tienda.html">Tienda</a>
    <a href="ropaaccesorios.html">Ropa y Accesorios</a>
    <a href="../CarritodelUsuario.html">Carrito</a>
    <a href="#">Mi cuenta</a>
  </nav>
</header>

<div class="center-container">
  <div class="product-card">
    <div class="product-images">
      <img src="../images/sombrero.jpg" alt="Sombrero OutdoorShield - Vista Frontal">
      <img src="../images/sombrero2.jpg" alt="Sombrero OutdoorShield - Vista Lateral">
    </div>
    <div class="product-info">
      <h1>Sombrero OutdoorShield</h1>
      <p>Protección para el sol y actividades al aire libre.</p>
      <div class="price">$14.99</div>
      <div class="buttons">
        <button class="add-to-cart" data-id="19" data-nombre="Sombrero OutdoorShield" data-precio="14.99" data-img="../images/sombrero.jpg">Agregar al carrito</button>
        <button id="buy-now" data-id="19" data-nombre="Sombrero OutdoorShield" data-precio="14.99" data-img="../images/sombrero.jpg">Comprar</button>
      </div>
    </div>
  </div>
</div>

<script>
  const addButtons = document.querySelectorAll('.add-to-cart');
  addButtons.forEach(button => {
    button.addEventListener('click', () => {
      const product = { id: button.dataset.id, nombre: button.dataset.nombre, precio: parseFloat(button.dataset.precio), img: button.dataset.img };
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push(product);
      localStorage.setItem('cart', JSON.stringify(cart));
      alert(`${product.nombre} se ha agregado al carrito`);
    });
  });
  const buyNowButton = document.getElementById('buy-now');
  buyNowButton.addEventListener('click', () => {
    const product = { id: buyNowButton.dataset.id, nombre: buyNowButton.dataset.nombre, precio: parseFloat(buyNowButton.dataset.precio), img: buyNowButton.dataset.img, cantidad:1 };
    localStorage.setItem('currentPurchase', JSON.stringify([product]));
    window.location.href = '/order';
  });
</script>

<footer>
  <a href="#">Facebook</a><a href="#">Instagram</a><a href="#">Twitter</a><a href="#">YouTube</a>
</footer>
</body>
</html>
