<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resumen de compra - Titan Fishing</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/bahnschrift');
    body, html { margin: 0; padding: 0; font-family: 'Bahnschrift SemiLight', sans-serif; min-height: 100vh; background: url('images/caña de pescar4.jpeg') no-repeat center center fixed; background-size: cover; position: relative; animation: fadeIn 1s ease-in-out; }
    body::before { content: ""; position: absolute; top:0; left:0; right:0; bottom:0; background-color: rgba(255,255,255,0.85); z-index:0; }
    header { position: relative; z-index:10; background-color: rgba(3,6,102,0.9); padding:15px 40px; display:flex; align-items:center; justify-content:space-between; }
    header img { height:80px; }
    nav a { color:white; margin:0 15px; text-decoration:none; font-weight:bold; }
    nav a:hover { text-decoration:underline; }
    .order-summary { position: relative; z-index:10; background: rgba(255,255,255,0.95); border-radius:15px; max-width:900px; margin:60px auto; padding:30px; box-shadow:0 10px 25px rgba(0,0,0,0.3); animation: slideIn 1s ease; }
    .product-summary { display:flex; align-items:center; gap:20px; margin-bottom:20px; border-bottom:1px solid #ccc; padding-bottom:15px; }
    .product-summary img { width:100px; border-radius:10px; border:1px solid #ccc; object-fit:cover; height:100px; }
    .summary-details { flex:1; }
    .summary-details h2 { margin:0; color:#030666; }
    .summary-details p { margin:5px 0; }
    .totals { text-align:right; margin-top:20px; font-size:1.1rem; }
    .totals strong { font-size:1.3rem; color:#021a99; }
    .payment-methods, .shipping-address, .card-details { margin-top:30px; }
    .payment-methods h3, .shipping-address h3, .card-details h3 { color:#030666; }
    .payment-methods ul { list-style:none; padding:0; }
    .payment-methods li { margin:8px 0; }
    .shipping-address input, .card-details input { width:100%; padding:8px; margin:5px 0; border-radius:5px; border:1px solid #ccc; box-sizing:border-box; }
    .buttons { display:flex; justify-content:space-between; margin-top:30px; }
    button { padding:12px 25px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:1rem; background-color:#030666; color:white; transition: background-color 0.3s; }
    button:hover { background-color:#021a99; }
    footer { position: relative; bottom:0; left:0; right:0; background-color: rgba(3,6,102,0.9); color:white; text-align:center; padding:10px; z-index:10; }
    footer a { color:white; margin:0 10px; text-decoration:none; }
    footer a:hover { text-decoration:underline; }
    .error { color: #b00020; margin-top:10px; }
    .success { color: #0a7a2d; margin-top:10px; font-weight:bold; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes slideIn { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  </style>
</head>
<body>

<header>
  <img src="images/logo2_white4.png" alt="Titan Fishing Logo">
  <nav>
    <a href="index.html">Inicio</a>
    <a href="CarritodelUsuario.html">Carrito</a>
    <a href="#">Mi cuenta</a>
  </nav>
</header>

<div class="order-summary">
  <h1>Resumen de tu compra</h1>
  <div id="products-container"></div>

  <div class="totals">
    <p>Subtotal: $<span id="subtotal">0.00</span></p>
    <p>IVA (21%): $<span id="tax">0.00</span></p>
    <p><strong>Total: $<span id="total">0.00</span></strong></p>
  </div>

  <div class="payment-methods">
    <h3>Métodos de pago</h3>
    <ul>
      <li><label><input type="radio" name="payment" value="tarjeta" checked> Tarjeta de crédito/débito</label></li>
      <li><label><input type="radio" name="payment" value="transferencia"> Transferencia bancaria</label></li>
      <li><label><input type="radio" name="payment" value="mercadopago"> MercadoPago</label></li>
    </ul>
  </div>

  <div class="card-details" id="card-details" style="display:none;">
    <h3>Detalles de la tarjeta</h3>
    <input type="text" id="cardNumber" placeholder="Número de tarjeta (ej: 4242 4242 4242 4242)">
    <input type="text" id="cardExpiry" placeholder="MM/AA">
    <input type="text" id="cardCVV" placeholder="CVV">
  </div>

  <div class="shipping-address">
    <h3>Dirección de envío</h3>
    <input type="text" id="street" placeholder="Calle y número" required>
    <input type="text" id="city" placeholder="Ciudad" required>
    <input type="text" id="state" placeholder="Provincia/Estado" required>
    <input type="text" id="zip" placeholder="Código postal" required>
  </div>

  <div class="buttons">
    <button onclick="window.location.href='index.html'">Seguir comprando</button>
    <button id="confirmBtn">Confirmar compra</button>
  </div>

  <div id="message" class=""></div>
</div>

<footer>
  <p>Síguenos en:
    <a href="#">Instagram</a> |
    <a href="#">Facebook</a> |
    <a href="#">YouTube</a>
  </p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const productsContainer = document.getElementById('products-container');
  let items = JSON.parse(localStorage.getItem('cartItems')) || [];

  // Si no hay carrito, usar producto seleccionado
  if (items.length === 0) {
    const selectedProduct = JSON.parse(localStorage.getItem('selectedProduct'));
    if (selectedProduct) items = [selectedProduct];
  }

  if (items.length === 0) {
    productsContainer.innerHTML = "<p>No hay productos para mostrar.</p>";
    return;
  }

  let subtotal = 0;
  items.forEach(product => {
    const productDiv = document.createElement('div');
    productDiv.className = 'product-summary';
    productDiv.innerHTML = `
      <img src="${product.image || product.img || 'images/no-img.png'}" alt="${product.name || product.nombre}">
      <div class="summary-details">
        <h2>${product.name || product.nombre}</h2>
        <p>Cantidad: ${product.quantity || product.cantidad || 1}</p>
        <p>Precio unitario: $${(product.price || product.precio || 0).toFixed(2)}</p>
      </div>
    `;
    productsContainer.appendChild(productDiv);
    subtotal += (product.price || product.precio || 0) * (product.quantity || product.cantidad || 1);
  });

  const tax = subtotal * 0.21;
  const total = subtotal + tax;

  document.getElementById('subtotal').textContent = subtotal.toFixed(2);
  document.getElementById('tax').textContent = tax.toFixed(2);
  document.getElementById('total').textContent = total.toFixed(2);

  // Mostrar/ocultar campos de tarjeta según método seleccionado
  const radios = document.querySelectorAll('input[name="payment"]');
  const cardDetails = document.getElementById('card-details');
  radios.forEach(r => {
    r.addEventListener('change', () => {
      cardDetails.style.display = r.value === 'tarjeta' ? 'block' : 'none';
    });
    // inicial state
    if (r.checked && r.value === 'tarjeta') cardDetails.style.display = 'block';
  });
});

document.getElementById('confirmBtn').addEventListener('click', confirmarCompra);

async function confirmarCompra() {
  const messageEl = document.getElementById('message');
  messageEl.className = '';
  messageEl.textContent = '';

  const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
  const shippingAddress = {
    street: document.getElementById('street').value.trim(),
    city: document.getElementById('city').value.trim(),
    state: document.getElementById('state').value.trim(),
    zip: document.getElementById('zip').value.trim()
  };

  // Validar dirección
  if (!shippingAddress.street || !shippingAddress.city || !shippingAddress.state || !shippingAddress.zip) {
    messageEl.className = 'error';
    messageEl.textContent = 'Por favor completa todos los campos de la dirección de envío.';
    return;
  }

  // Obtener items desde localStorage (carrito o producto seleccionado)
  let items = JSON.parse(localStorage.getItem('cartItems')) || [];
  const selectedProduct = JSON.parse(localStorage.getItem('selectedProduct'));
  if (items.length === 0 && selectedProduct) items = [selectedProduct];
  if (items.length === 0) {
    messageEl.className = 'error';
    messageEl.textContent = 'No hay productos para crear la orden.';
    return;
  }

  // Mapear items a la estructura esperada por OrderRequestDTO
  const itemsToSend = items.map(p => ({
    id: p.id,
    nombre: p.name || p.nombre,
    precio: Number(p.price || p.precio || 0),
    cantidad: Number(p.quantity || p.cantidad || 1)
  }));

  // Si seleccionó tarjeta, validar campos y armar cardData (simulado)
  let paymentDetails = null;
  if (paymentMethod === 'tarjeta') {
    const cardNumber = document.getElementById('cardNumber').value.trim();
    const cardExpiry = document.getElementById('cardExpiry').value.trim();
    const cardCVV = document.getElementById('cardCVV').value.trim();

    if (!cardNumber || !cardExpiry || !cardCVV) {
      messageEl.className = 'error';
      messageEl.textContent = 'Por favor completa todos los datos de la tarjeta.';
      return;
    }

    // Validaciones simples (no reemplaza validación real)
    const ccClean = cardNumber.replace(/\s+/g, '');
    if (!/^\d{13,19}$/.test(ccClean)) {
      messageEl.className = 'error';
      messageEl.textContent = 'Número de tarjeta inválido.';
      return;
    }
    if (!/^\d{2}\/\d{2}$/.test(cardExpiry)) {
      messageEl.className = 'error';
      messageEl.textContent = 'Formato de vencimiento inválido. Usa MM/AA.';
      return;
    }
    if (!/^\d{3,4}$/.test(cardCVV)) {
      messageEl.className = 'error';
      messageEl.textContent = 'CVV inválido.';
      return;
    }

    paymentDetails = {
      cardNumber: ccClean,
      cardExpiry: cardExpiry,
      cardCVV: cardCVV
    };
  }

  // Preparar payload
  const payload = {
    // userId no obligatorio si tu backend usa autenticación; lo dejamos fuera para que backend use sesión
    items: itemsToSend,
    paymentMethod: paymentMethod === 'tarjeta' ? 'CARD' : (paymentMethod === 'mercadopago' ? 'MERCADOPAGO' : 'BANK_TRANSFER'),
    shippingAddress: shippingAddress,
    paymentDetails: paymentDetails // En producción, tokenizar en frontend o enviar a proveedor
  };

  try {
    // Mostrar mensaje de envío
    messageEl.className = '';
    messageEl.textContent = 'Procesando orden...';

    const response = await fetch('/orders/frontend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const errorText = await response.text();
      console.error('Error al crear la orden:', errorText);
      messageEl.className = 'error';
      messageEl.textContent = '❌ Error al crear la orden: ' + (errorText || response.statusText);
      return;
    }

    const data = await response.json();

    // Mensaje de éxito
    messageEl.className = 'success';
    messageEl.textContent = `¡Compra confirmada! Número de orden: ${data.id}`;

    // Limpiar localStorage
    localStorage.removeItem('cartItems');
    localStorage.removeItem('selectedProduct');

    // Redirigir después de 2s a inicio o a la página que prefieras
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 2000);

  } catch (err) {
    console.error(err);
    messageEl.className = 'error';
    messageEl.textContent = 'Error de conexión con el servidor.';
  }
}
</script>

</body>
</html>
