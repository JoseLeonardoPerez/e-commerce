<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pago con Tarjeta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.cdnfonts.com/css/bahnschrift');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Bahnschrift SemiLight', sans-serif;
      color: black;
      background: #000;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url('images/compraexitosa.jpg') center center no-repeat;
      background-size: cover;
      filter: blur(5px) brightness(0.45);
      z-index: -2;
    }

    body { opacity: 0; animation: aparecer 0.6s ease-in-out forwards; }
    @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

    header {
      background-color: rgba(3,6,102,0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100px;
      padding: 0 30px;
      z-index: 10;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    header .logo-container img { height: 150px; width: auto; }
    header nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 25px; flex: 1; margin-left: 30px; }
    header nav a { color: white; text-decoration: none; font-weight: bold; font-size: 1rem; transition: color 0.3s; }
    header nav a:hover { color: #ffcc00; }

    .contenedor { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 1; padding-top: 140px; padding-bottom: 100px; min-height: 100vh; }

    .card {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.95);
      color: #222;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      animation: cardAppear 0.6s ease-in-out;
    }

    @keyframes cardAppear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    h2 { text-align: center; margin-bottom: 20px; color: #030666; }

    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: 500; }
    input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    input:focus { border-color: #036; outline: none; }

    .error { color: red; font-size: 13px; margin-top: -6px; margin-bottom: 6px; }

    button {
      background-color: #036;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
      transition: background 0.3s;
    }
    button:hover { background-color: #024; }

    footer {
      background: rgba(34,34,34,0.95);
      color: white;
      text-align: center;
      padding: 20px;
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      z-index: 3;
    }

    @media screen and (max-width: 1024px) {
      header { flex-direction: column; height: auto; padding: 10px; }
      header .logo-container img { height: 100px; margin-bottom: 10px; }
      header nav { gap: 10px; justify-content: center; margin-right: 0; }
      .card { padding: 20px; max-width: 90%; }
    }

    @media screen and (max-width: 600px) { .card { padding: 16px; } }
  </style>
</head>
<body>
<header>
  <div class="logo-container">
    <img src="images/logo2_white4.png" alt="Titan Fishing Logo">
  </div>
  <nav>
    <a href="/index.html">Inicio</a>
    <a href="/tienda.html">Tienda</a>
    <a href="/CarritodelUsuario.html">Carrito</a>
    <a href="/lineasyanzuelos.html">Líneas y Anzuelos</a>
    <a href="/senuelosycarnadas.html">Señuelos y Carnadas</a>
  </nav>
</header>

<main class="contenedor">
  <div class="card" role="region" aria-label="Pago con tarjeta">
    <h2>Pago con Tarjeta de Crédito / Débito</h2>
    <form id="formTarjeta">
      <label>Nombre del titular</label>
      <input type="text" required>

      <label>Número de tarjeta</label>
      <input type="text" maxlength="19" required>
      <div id="errorTarjeta" class="error"></div>

      <label>Fecha de vencimiento</label>
      <input type="month" required>

      <label>CVV</label>
      <input type="text" maxlength="4" required>
      <div id="errorCVV" class="error"></div>

      <button type="submit">Pagar ahora</button>
    </form>
  </div>
</main>

<footer>
  &copy; 2025 Titan Fishing | Síguenos en redes sociales
</footer>

<script>
document.getElementById("formTarjeta").addEventListener("submit", function(e){
  e.preventDefault();

  const numero = this[1].value.replace(/\s+/g, ''); // quitar espacios
  const cvv = this[3].value.trim();
  const errorTarjeta = document.getElementById("errorTarjeta");
  const errorCVV = document.getElementById("errorCVV");
  errorTarjeta.textContent = "";
  errorCVV.textContent = "";

  let valido = false;

  // Validación Visa
  if(/^4\d{12}(\d{3})?(\d{3})?$/.test(numero)) valido = true; // 13,16,19
  // Validación Mastercard
  else if(/^5[1-5]\d{14}$/.test(numero) || /^(222[1-9]|22[3-9]\d|2[3-6]\d{2}|27[01]\d|2720)\d{12}$/.test(numero)) valido = true;
  // Validación Amex
  else if(/^3[47]\d{13}$/.test(numero)) valido = true;

  if(!valido){
    errorTarjeta.textContent = "Número de tarjeta inválido o no soportado.";
    return;
  }

  // CVV según tarjeta
  if(/^3[47]/.test(numero)){ // Amex
    if(!/^\d{4}$/.test(cvv)){
      errorCVV.textContent = "CVV inválido (Amex requiere 4 dígitos).";
      return;
    }
  } else {
    if(!/^\d{3}$/.test(cvv)){
      errorCVV.textContent = "CVV inválido (Visa/Mastercard requieren 3 dígitos).";
      return;
    }
  }

  alert("✅ Pago realizado con éxito.");
  window.location.href = "/success.html";
});
</script>
</body>
</html>
